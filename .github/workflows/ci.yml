name: ci

# One workflow, one required check. Every gate this repo has runs here, and the
# `ci-gate` job at the bottom fans them all in: it is the ONLY context the
# branch ruleset requires. Add, rename or drop a job freely - the ruleset never
# has to change and can never go stale.
#
# (It went stale once: the ruleset required `analyze` from a CodeQL workflow that
# GitHub had auto-disabled when CodeQL default setup was turned on, so the
# context could never report and every PR sat BLOCKED forever. The fan-in job
# makes that class of bug impossible.)
#
# Actions are pinned to a commit SHA, not a tag: a tag is mutable and a
# compromised upstream can repoint it. Dependabot bumps the SHAs weekly and the
# comment carries the human-readable version.

on:
  push:
    branches: [main]
  pull_request:
  merge_group: # so the same gate guards a merge queue if one is ever enabled

# Least privilege: nothing at the workflow level, and every job asks for
# exactly what it uses - here, reading the checkout (zizmor
# excessive-permissions; CodeQL actions/missing-workflow-permissions).
permissions: {}

# One run per PR: a force-push supersedes the previous run instead of racing it.
# Never cancel a push to main or a merge-queue run - those results are recorded.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # Inline rather than pre-commit/action: that composite resolves
      # actions/cache by a mutable tag and pip-installs an unpinned pre-commit,
      # both invisible to zizmor and Dependabot. Here the cache is SHA-pinned
      # and the pre-commit version is .github/pre-commit/requirements.txt,
      # which Dependabot's pip ecosystem bumps.
      - run: python -m pip install --disable-pip-version-check -r .github/pre-commit/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.github/pre-commit/requirements.txt') }}
      - run: pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          # swift-format needs the Swift toolchain, which isn't on this runner;
          # the swift-core job runs it. All other hooks run here.
          SKIP: swift-format

  # Every Node the package claims: the engines floor in package.json and the
  # active LTS. A floor nothing runs is a floor nobody knows still works.
  js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test "tests/*.test.js"

  # The screenshots in docs/ are GENERATED from scripts/screenshots/data.json by
  # code that drives the real shared logic (normalize, forecast, labels). A
  # UI-visible contract change that forgets to regenerate them fails here:
  #   node scripts/screenshots/render.mjs
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: node scripts/screenshots/render.mjs --check

  # Translations are hand-written but the template and the merges are not: this
  # fails when a new _() string was added without running scripts/update-po.sh,
  # and when a catalog no longer compiles (a reordered %s in a format string is
  # the usual way that happens).
  i18n:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: ./scripts/update-po.sh --check
      - name: Every catalog compiles
        run: |
          for po in claude-usage-panel@fschmutz.github.io/po/*.po; do
            msgfmt --check --statistics -o /dev/null "$po"
          done

  # Linux: fast parity gate - builds/tests only the Foundation-only core.
  swift-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain is .github/swift/Dockerfile: the official swift image
      # pinned by digest, bumped by Dependabot's docker ecosystem.
      - run: docker build --quiet --tag cup-swift .github/swift
      # Warnings are errors: a green build whose log carried two unread
      # warnings for weeks is how this flag got here. The package is in Swift 6
      # language mode, so a concurrency violation is an error too.
      - run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/repo" -w /repo/macos cup-swift
          swift test -Xswiftc -warnings-as-errors
      # The toolchain is here, so the Swift formatter gate runs here too (the
      # pre-commit job skips it: no Swift on that runner).
      - run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/repo" -w /repo/macos cup-swift
          swift format lint --strict --recursive Sources Tests

  # macOS: compile the real SwiftUI menu-bar app (macOS-only target) so type
  # errors in the app layer are caught in CI, not only when a Mac user builds it.
  macos-app:
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift build -Xswiftc -warnings-as-errors # includes the macOS-only ClaudeUsagePanel executable
        working-directory: macos
      - run: swift test -Xswiftc -warnings-as-errors # core + parity suites on Apple's toolchain too
        working-directory: macos

  # macOS still ships bash 3.2 as /bin/bash, and the launchd agents invoke it
  # directly. Every other shell gate here runs on ubuntu's bash 5, where the
  # 3.2 traps are invisible - expanding "${arr[@]}" on an empty array aborts
  # under `set -u` in 3.2 and is fine in 4.4+, so a guard that reads correctly
  # on Linux can die on a stock Mac. The smoke script parses every shell script
  # and dry-runs every target install.sh advertises, so a new target is covered
  # the day it lands without touching this file.
  bash32:
    name: bash32
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image is .github/bash32/Dockerfile: pinned by digest, bumped by
      # Dependabot's docker ecosystem. Never a bare `bash:3.2` tag here.
      - run: docker build --quiet --tag cup-bash32 .github/bash32
      - run: docker run --rm -v "$PWD:/repo:ro" -e HOME=/tmp cup-bash32 bash /repo/scripts/bash32-smoke.sh

  # The marketplace (.claude-plugin/marketplace.json) and the plugin (plugin/)
  # as Claude Code itself reads them. `--strict` turns every warning into exit
  # 1, and the output is checked as well, so a warning cannot pass as green.
  # The CLI is .github/claude-cli/package-lock.json, one exact version bumped
  # by Dependabot: a new CLI that adds a warning shows up as a red Dependabot
  # PR to fix, never as an unrelated PR turning red overnight.
  plugin-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
        working-directory: .github/claude-cli
      - name: claude plugin validate --strict (marketplace, then plugin)
        env:
          # A throwaway config dir: the validator must not depend on, or
          # write to, any login or settings.
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
          DISABLE_AUTOUPDATER: "1"
          DISABLE_TELEMETRY: "1"
        run: |
          cli=.github/claude-cli/node_modules/.bin/claude
          "$cli" --version
          for target in . plugin; do
            rc=0
            out="$("$cli" plugin validate --strict "$target" 2>&1)" || rc=$?
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ]; then
              echo "::error::claude plugin validate $target failed (exit $rc)"
              exit 1
            fi
            if printf '%s\n' "$out" | grep -qi 'warning'; then
              echo "::error::claude plugin validate $target reported a warning"
              exit 1
            fi
          done

  # ── The one required check ──────────────────────────────────────────────────
  # Requires every job above to have actually SUCCEEDED. `if: always()` is what
  # makes that true: without it this job would be skipped when a dependency
  # fails, and a skipped required check reports neutral - i.e. it would wave
  # through exactly the failures it exists to catch. `cancelled` and `skipped`
  # are failures here too, never a pass.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [lint, js, screenshots, i18n, swift-core, macos-app, bash32, plugin-validate]
    runs-on: ubuntu-latest
    permissions: {} # reads only the needs context, never the repo
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          if printf '%s\n' "$RESULTS" | jq -e 'to_entries | map(.value.result == "success") | all' >/dev/null; then
            echo "All CI jobs succeeded."
          else
            echo "::error::One or more CI jobs did not succeed (see the table above)."
            exit 1
          fi
