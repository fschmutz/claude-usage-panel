name: release

# Cut a GitHub Release automatically when a version tag is pushed. The flow is:
#   scripts/bump-version.sh X.Y.Z  →  commit  →  git tag vX.Y.Z && push --tags
# and this workflow does the rest: build the GNOME extension zip, pull the notes
# for that version out of CHANGELOG.md, and publish the Release with the zip
# attached. Re-runnable for an existing tag via "Run workflow": both jobs check
# out that tag, whatever branch the run was dispatched from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v1.4.0"
        required: true

# Least privilege: nothing at the workflow level; each job asks for exactly
# what it writes (release and macos-asset publish release assets, so they need
# contents: write; homebrew-tap only reads here and writes to the tap with its
# own token).
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      # Resolved BEFORE the checkout, because the checkout must be the tag.
      # On a tag push GITHUB_REF_NAME is the tag; on workflow_dispatch the ref
      # is a branch (e.g. main), so the explicit `tag` input must win.
      - name: Resolve tag
        id: t
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Refusing to release non-version tag: '$tag'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Build from the tag, never from the dispatching branch: a re-run for an
      # old tag that checked out main would upload main's code under that tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.t.outputs.tag }}
          persist-credentials: false

      # The tree is the tag, and the tag is the version every site carries.
      # A tag cut before bump-version.sh would ship a release whose installed
      # version never reaches the tag, so auto-update would reinstall it daily.
      - name: Verify the checkout is the tag and matches every version site
        env:
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          # Compared here as well as in the script: the script is the tag's
          # own copy, and tags older than its --tag flag ignore the argument.
          ver="$(node -p 'require("./package.json").version')"
          if [ "v$ver" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json $ver" >&2
            exit 1
          fi
          scripts/check-versions.sh --tag "$TAG"

      # Build the installable GNOME zip: metadata.json at the root, the compiled
      # GSettings schema, compiled translations, the worker scripts - the exact
      # layout install.sh gnome installs, from the same script.
      - name: Build GNOME extension zip
        id: pack
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin gettext zip
          uuid="claude-usage-panel@fschmutz.github.io"
          scripts/pack-gnome.sh "$RUNNER_TEMP/$uuid"
          (cd "$RUNNER_TEMP/$uuid" && zip -rq "$GITHUB_WORKSPACE/$uuid.shell-extension.zip" .)
          echo "zip=$uuid.shell-extension.zip" >> "$GITHUB_OUTPUT"

      # Pull just this version's section out of CHANGELOG.md for the release body.
      - name: Extract release notes
        run: |
          ver="${TAG#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { p = 1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release $TAG" > notes.md; fi
          echo "----- notes -----"; cat notes.md
        env:
          TAG: ${{ steps.t.outputs.tag }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.t.outputs.tag }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md "$ZIP"
          fi

  # Build the macOS .app on a Mac runner and attach it to the release. With
  # the six MACOS_*/APPLE_* secrets below configured (repo Settings ▸ Secrets),
  # scripts/notarize-macos.sh signs it with a Developer ID and notarizes it;
  # with none of them set it stays ad-hoc signed, so first launch needs a
  # right-click ▸ Open - or just build locally with `./install.sh macos`.
  # Details either way: PUBLISHING.md.
  macos-asset:
    needs: release
    runs-on: macos-latest
    # Signing and notarization wait on Apple; bound the job rather than let a
    # stuck submission hold a Mac runner for the account-wide default.
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      # Same tag as the release job, never the dispatching branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Verify the checkout is the tag
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
      - name: Build the .app (no /Applications install)
        run: ./install.sh macos --build-only
      - name: Sign with Developer ID and notarize (no-op without the secrets)
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/notarize-macos.sh "macos/ClaudeUsagePanel.app"
      - name: Zip and upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          ditto -c -k --keepParent "macos/ClaudeUsagePanel.app" "ClaudeUsagePanel-macos.zip"
          gh release upload "$TAG" "ClaudeUsagePanel-macos.zip" --clobber
      # The cask is only useful pinned to the zip that was just built, so it is
      # generated here rather than committed with a stale checksum.
      - name: Attach the Homebrew cask, pinned to that zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          ./scripts/make-cask.sh "$TAG" "ClaudeUsagePanel-macos.zip"
          gh release upload "$TAG" "Casks/claude-usage-panel.rb" --clobber

  # Push the pinned cask to the tap, so `brew install --cask
  # fschmutz/tap/claude-usage-panel` and `brew upgrade` follow the releases.
  # A job of its own, fed by the release asset rather than a file passed
  # between jobs: a failed tap push re-runs alone, without rebuilding or
  # re-notarizing the app. HOMEBREW_TAP_TOKEN (repo Settings > Secrets) is a
  # fine-grained token with contents:write on fschmutz/homebrew-tap and
  # nothing else; this repo's own token cannot write there. Without it the job
  # fails: a release that brew users never see is not a success.
  homebrew-tap:
    needs: [release, macos-asset]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Download the cask pinned to this release's zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release download "$TAG" --pattern claude-usage-panel.rb --dir "$RUNNER_TEMP/cask"
      - name: Publish it to fschmutz/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: ./scripts/publish-cask.sh "$TAG" "$RUNNER_TEMP/cask/claude-usage-panel.rb"
