# Proves the Homebrew tap credentials the release workflow uses still work,
# without cutting a release: mints the same GitHub App installation token as
# release.yml's homebrew-tap job (contents:write on fschmutz/homebrew-tap
# only) and reads the tap with it. The mint itself fails when the App is not
# installed on the tap or lacks contents:write. Run by
# scripts/setup-tap-app.sh after setup, or by hand: gh workflow run tap-check.yml
name: tap-check

on:
  workflow_dispatch:

permissions: {}

jobs:
  tap-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint a tap token (GitHub App, contents:write on homebrew-tap only)
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: fschmutz
          repositories: homebrew-tap
          permission-contents: write
      - name: Read the tap with it
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: gh api repos/fschmutz/homebrew-tap/git/ref/heads/main --jq .object.sha
