name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test "tests/*.test.js"

  # Linux: fast parity gate — builds/tests only the Foundation-only core.
  swift-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - run: swift test
        working-directory: macos

  # macOS: compile the real SwiftUI menu-bar app (macOS-only target) so type
  # errors in the app layer are caught in CI, not only when a Mac user builds it.
  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift build          # includes the macOS-only ClaudeUsagePanel executable
        working-directory: macos
      - run: swift test           # core + parity suites on Apple's toolchain too
        working-directory: macos
