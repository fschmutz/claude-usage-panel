name: attribution-guard

# Bundle A — core. Always on.
#
# The author of record is the human who owns the change. This job fails a pull
# request that carries somebody else's name: a commit authored or committed by
# an address that is not on `.github/attribution-allow.txt`, or under a name
# that reads as a tool, a `Co-authored-by:` trailer naming anyone else, an
# assistant footer in a commit message, or one in the title or the body.
#
# It is a separate workflow rather than a job in `ci.yml` for one reason: the
# title and the body are editable after the fact. `ci.yml` runs on the default
# pull_request types, which do not include `edited`, so a footer pasted into
# the description ten minutes after the last push would never be looked at
# again.
#
# Everything it knows lives in `scripts/attribution-guard.sh`, which reads the
# commits through the API and the title and body out of the event payload,
# re-reading both from the API on `edited`. The fixtures run first: a guard
# that has quietly stopped matching is worse than no guard, because the check
# is green either way.
#
# ADAPTED for this repository, which requires exactly ONE status check
# (`ci-gate`, the fan-in job of `ci.yml`) and never adds a second to the
# ruleset: the push side of the guard is the `attribution-guard` job of
# `ci.yml`, behind that gate, and this workflow keeps only the `edited` type -
# the one `ci.yml` cannot see without rebuilding every other gate on a title or
# description edit. Both run the same two commands against the same script, so
# neither can drift; only the trigger and the check name differ.
on:
  pull_request:
    types: [edited]

# Least privilege, this repo's shape: nothing at the workflow level, and the
# one job asks for exactly what it reads (tests/ci-release.test.js enforces it).
permissions: {}

concurrency:
  group: attribution-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: attribution guard (edited title or body)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The guard still catches what it is for
        # Without the live event: its `edited` action would switch every
        # fixture case to --refresh-text and send it to the API.
        run: env -u GITHUB_EVENT_PATH ./scripts/tests/attribution-guard-test.sh

      # GH_TOKEN is the pull request's own read-only token: the script calls
      # repos/:repo/pulls/:number/commits, and nothing else.
      - name: This pull request carries no foreign attribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/attribution-guard.sh
