name: pre-commit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pre-commit/action@v3.0.1
        env:
          # swift-format needs the Swift toolchain, which isn't on the runner;
          # it is still enforced locally. All other hooks run in CI.
          SKIP: swift-format
