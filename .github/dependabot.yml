version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A freshly published release is not proposed for 7 days. A compromised
    # upstream is usually caught and yanked inside that window, so the bump
    # never reaches a PR - the cheapest supply-chain control there is.
    cooldown:
      default-days: 7

    # Actions are pinned to a commit SHA in the workflows (a tag is mutable).
    # Dependabot rewrites the SHA and refreshes the trailing version comment,
    # so pinning costs no manual upkeep.
    groups:
      # One PR a week for the routine bumps instead of one per action.
      actions-minor:
        update-types: [minor, patch]
    labels: [dependencies]
    open-pull-requests-limit: 5

  # The hook revs in .pre-commit-config.yaml, frozen to a commit SHA with the
  # tag in a `# frozen:` comment. Without this entry nothing ever bumped them.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      hooks-minor:
        update-types: [minor, patch]
    labels: [dependencies]
    open-pull-requests-limit: 5

  # The pre-commit the CI lint job installs (.github/pre-commit/requirements.txt).
  - package-ecosystem: pip
    directory: /.github/pre-commit
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    open-pull-requests-limit: 2

  # The bash32 job's image (.github/bash32/Dockerfile), pinned by digest. Held
  # to 3.2: that job exists to run the bash macOS ships, not the newest one.
  - package-ecosystem: docker
    directory: /.github/bash32
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: bash
        versions: [">= 3.3"]
    labels: [dependencies]
    open-pull-requests-limit: 2

  # The swift-core job's toolchain (.github/swift/Dockerfile), pinned by digest.
  - package-ecosystem: docker
    directory: /.github/swift
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    open-pull-requests-limit: 2

  # The Claude Code CLI the plugin-validate CI job runs
  # (.github/claude-cli/package-lock.json), pinned to one exact version. A
  # bump whose validator finds a new warning goes red on its own PR.
  - package-ecosystem: npm
    directory: /.github/claude-cli
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    open-pull-requests-limit: 2
