# Pre-commit hooks for claude-usage-panel.
# Install:  pipx install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
minimum_pre_commit_version: "3.5.0"

repos:
  # Generic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-json
      - id: check-xml
      - id: check-yaml

  # Secret scanning - never commit an API key or credential
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # JavaScript (GNOME Shell / GJS)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.15.0
    hooks:
      - id: eslint
        files: \.js$
        args: [--max-warnings=0]
        additional_dependencies:
          - eslint@9.15.0

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        args: [-i, "4", -ci]

  # Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint

  # GitHub Actions workflows - catch workflow bugs before they ship (the
  # release.yml dispatch-tag bug would have been caught here).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # GitHub Actions SECURITY - actionlint checks that a workflow is valid, zizmor
  # checks that it is safe: unpinned actions, over-broad permissions, credential
  # persistence, template injection. Offline mode so it needs no token in CI.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        args: [--no-progress, --no-online-audits]

  # Project-local guards
  - repo: local
    hooks:
      # Em-dashes (U+2014) are banned everywhere in this repo: docs, UI strings,
      # code. The pattern is built from escape bytes so this config line itself
      # stays clean.
      - id: no-em-dash
        name: no em-dash
        language: system
        entry: bash -c 'd=$(printf "\342\200\224"); out=$(grep -Hn "$d" "$@" || true); if [ -n "$out" ]; then echo "$out"; echo "em-dash (U+2014) is forbidden; use - or rephrase"; exit 1; fi' --
        types: [text]
      # Swift (uses the toolchain's built-in swift-format)
      - id: swift-format
        name: swift-format lint
        language: system
        entry: swift format lint --strict
        files: \.swift$
      # Version single-source: metadata.json / cask / install.sh must match package.json
      - id: check-versions
        name: version consistency
        language: system
        entry: scripts/check-versions.sh
        pass_filenames: false
        files: ^(package\.json|claude-usage-panel@fschmutz\.github\.io/metadata\.json|PUBLISHING\.md|install\.sh)$
