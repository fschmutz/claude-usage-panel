# Pre-commit hooks for claude-usage-panel.
# Install:  pipx install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
# Remote revs are frozen to a commit SHA (a tag is mutable) with the tag in the
# `# frozen:` comment; Dependabot's pre-commit ecosystem bumps both.
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Generic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-json
      - id: check-xml
      - id: check-yaml

  # Secret scanning - never commit an API key or credential
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # Private names (internal projects, customers, work addresses) must never
  # reach this public repo. The list lives OUTSIDE it (it is private itself):
  # see scripts/check-private-names.sh. Without a list the hook is skipped.
  - repo: local
    hooks:
      - id: private-names
        name: no private names
        language: system
        entry: scripts/check-private-names.sh
        types: [text]
      - id: private-names-message
        name: no private names in the commit message
        language: system
        entry: scripts/check-private-names.sh --message-file
        stages: [commit-msg]

  # JavaScript (GNOME Shell / GJS)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: 809d037d62978decc620b5a55e8ee5b8b54d8d65  # frozen: v10.11.0
    hooks:
      - id: eslint
        files: \.m?js$
        # No additional_dependencies: the mirror's hook already installs the
        # eslint of its own rev, so the frozen rev above is the one pin
        # Dependabot bumps. A second copy here drifted from it.
        args: [--max-warnings=0]

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9  # frozen: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-i, "4", -ci]

  # Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # frozen: v0.49.1
    hooks:
      - id: markdownlint

  # GitHub Actions workflows - catch workflow bugs before they ship (the
  # release.yml dispatch-tag bug would have been caught here).
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  # GitHub Actions SECURITY - actionlint checks that a workflow is valid, zizmor
  # checks that it is safe: unpinned actions, over-broad permissions, credential
  # persistence, template injection. Offline mode so it needs no token in CI.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--no-progress, --no-online-audits]

  # Project-local guards
  - repo: local
    hooks:
      # Em-dashes (U+2014) are banned everywhere in this repo: docs, UI strings,
      # code. The pattern is built from escape bytes so this config line itself
      # stays clean.
      - id: no-em-dash
        name: no em-dash
        language: system
        entry: bash -c 'd=$(printf "\342\200\224"); out=$(grep -Hn "$d" "$@" || true); if [ -n "$out" ]; then echo "$out"; echo "em-dash (U+2014) is forbidden; use - or rephrase"; exit 1; fi' --
        types: [text]
      # Swift (uses the toolchain's built-in swift-format)
      - id: swift-format
        name: swift-format lint
        language: system
        entry: swift format lint --strict
        files: \.swift$
      # Version single-source: every site in scripts/version-sites.sh must match
      # package.json. Runs on every commit (~50 ms) - a `files:` filter listing
      # the sites is a second copy of that list, and it drifted.
      - id: check-versions
        name: version consistency
        language: system
        entry: scripts/check-versions.sh
        pass_filenames: false
        always_run: true
      # File size: 700 lines per file, or an exemption named in the script
      # with its reason. No numeric slack; a stale exemption fails too.
      - id: file-size
        name: file-size ceiling (700 lines)
        language: system
        entry: scripts/check-file-size.sh
        pass_filenames: false
        always_run: true
      # Translations: a touched _() string must reach the template and every
      # catalog. CI ran this and pre-commit did not, so the break was only
      # visible after a push - the two gates now check the same thing. Skipped
      # (not silently passed) when gettext is missing; CI always has it.
      - id: i18n-catalogs
        name: i18n catalogs up to date
        language: system
        entry: bash -c 'command -v xgettext >/dev/null || { echo "xgettext not installed - catalogs unchecked (apt install gettext)"; exit 0; }; exec scripts/update-po.sh --check'
        files: ^claude-usage-panel@fschmutz\.github\.io/.*\.(js|po|pot)$
        pass_filenames: false
